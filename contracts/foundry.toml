[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

# Base Sepolia configuration
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"

# Etherscan API for verification
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}" }

# Show all compiler warnings
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

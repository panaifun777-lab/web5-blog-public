name: reach-test
on:
  push:
    paths:
      - '.github/workflows/reach-test.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SSH port
        run: |
          set +e
          timeout 10 bash -c '</dev/tcp/8.55.146.192/22' && echo "SSH_OPEN" || echo "SSH_BLOCKED"
          timeout 10 bash -c '</dev/tcp/8.55.146.192/443' && echo "HTTPS_OPEN" || echo "HTTPS_BLOCKED"
          getent hosts web5.blog || true

name: Uptime probe

# External check: runs outside the VPS so origin outages (522, PM2 down, disk full)
# surface as a GitHub issue instead of waiting for a user report.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public endpoints
        run: |
          set -u
          SITE="${SITE_URL:-https://web5.blog}"
          fail=0

          check() {
            name="$1"; url="$2"; expect="$3"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H 'User-Agent: web5-uptime-probe/1.0' "$url" 2>/dev/null || echo 000)
            printf '%-14s %-45s -> %s (expect %s)\n' "$name" "$url" "$code" "$expect"
            if [ "$code" != "$expect" ]; then
              fail=1
              echo "::error title=$name unavailable::GET $url returned $code"
            fi
          }

          check home        "$SITE/"                 200
          check content_api "$SITE/api/content/list" 200
          check llms        "$SITE/llms.txt"         200
          check x402        "$SITE/api/market/x402-market" 200

          exit $fail

  notify:
    name: Open or close incident
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_RESULT: ${{ needs.probe.result }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production probe failing: web5.blog';
            const ok = process.env.PROBE_RESULT === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = open.find((i) => i.title === title);

            if (ok) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Recovered. Probe run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                core.info(`Closed incident #${existing.number}`);
              } else {
                core.info('All endpoints healthy, no incident open.');
              }
              return;
            }

            if (existing) {
              core.info(`Incident #${existing.number} is already open, leaving it untouched.`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Automated uptime probe failed against https://web5.blog',
                  '',
                  `Run: ${runUrl}`,
                  '',
                  'Likely causes: origin unreachable (Cloudflare 522), PM2 process down, disk full, or TLS/nginx failure.',
                  'Recovery closes this issue automatically.',
                ].join('\n'),
              });
              core.info(`Opened incident #${created.number}`);
            }
